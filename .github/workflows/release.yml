name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Conventional Release
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run checks (fixture-driven, no splash server needed)
        run: |
          bash Scripts/check_core.sh
          bash Scripts/check_agent_status.sh

      - name: Run Swift Testing suite
        run: |
          swift --version
          # Tests read Tests/Fixtures only; the Testing module comes from the
          # runner's Xcode. If a future macos image drops it, this names the fix.
          swift test || {
            echo "swift test failed — if 'import Testing' is unresolvable, the runner image lost the Testing module; install a Swift 6 toolchain (e.g. brew install swift) and re-run with PATH pointed at it."
            exit 1
          }

      - name: Calculate version from Conventional Commits
        id: tag_version
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Not "angular": v7 bundles conventional-changelog-angular 5, whose
          # header pattern cannot parse "type!:" — breaking commits degrade
          # to default_bump (this is how 0.9.1 got cut instead of 1.0.0).
          commit_analyzer_preset: "conventionalcommits"
          # "false" (not "patch"): eligible commits that select no bump
          # (docs, chore, style, test, refactor) must mint no tag. Only
          # feat/fix/perf/breaking select a bump; everything else rides the
          # changelog of the next shippable release. Verified against the v7
          # README ("set false to avoid generating a new tag when none is
          # explicitly provided"); there is no per-type "skip" value, so do
          # not invent one here — a wrong value degrades silently to a bump.
          default_bump: "false"
          release_branches: "main"

      - name: Build Release Bundle
        if: ${{ steps.tag_version.outputs.new_tag }}
        run: |
          bash Scripts/make-app.sh
          cd dist
          zip -r "SplashControl-${{ steps.tag_version.outputs.new_tag }}.zip" Splash.app
          shasum -a 256 "SplashControl-${{ steps.tag_version.outputs.new_tag }}.zip" > "SplashControl-${{ steps.tag_version.outputs.new_tag }}.zip.sha256"

      - name: Create GitHub Release
        if: ${{ steps.tag_version.outputs.new_tag }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          files: |
            dist/SplashControl-${{ steps.tag_version.outputs.new_tag }}.zip
            dist/SplashControl-${{ steps.tag_version.outputs.new_tag }}.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Homebrew cask
        if: ${{ steps.tag_version.outputs.new_tag }}
        # Renders the cask from the release zip's tag + sha256 and pushes it to
        # the vlewin/tap repo (Casks/splash-control.rb). Publishing needs a
        # TAP_TOKEN secret — a classic PAT with 'repo' scope on the tap repo;
        # without it the step renders the cask and skips the push.
        run: |
          cd dist
          SHA256=$(cut -d ' ' -f1 "SplashControl-${{ steps.tag_version.outputs.new_tag }}.zip.sha256")
          bash ../Scripts/render-cask.sh "${{ steps.tag_version.outputs.new_tag }}" "$SHA256"
          if [[ -z "${TAP_TOKEN:-}" ]]; then
            echo "::warning::TAP_TOKEN is not set — rendered the cask but did not publish it."
            echo "To enable: 1) create https://github.com/vlewin/tap (public),"
            echo "2) add a TAP_TOKEN secret (classic PAT, 'repo' scope on the tap repo)"
            echo "under Settings -> Secrets and variables -> Actions."
            echo "The next release will publish the cask automatically."
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/vlewin/tap.git" tap
          mkdir -p tap/Casks
          cp "SplashControl-${{ steps.tag_version.outputs.new_tag }}.cask" tap/Casks/splash-control.rb
          brew tap vlewin/tap tap
          brew audit --strict vlewin/tap/splash-control
          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "github-actions[bot]@users.noreply.github.com"
          git -C tap add Casks/splash-control.rb
          if git -C tap diff --cached --quiet; then
            echo "Cask already at ${{ steps.tag_version.outputs.new_tag }}; nothing to push."
          else
            git -C tap commit -m "splash-control: ${{ steps.tag_version.outputs.new_tag }}"
            git -C tap push
          fi
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
