name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-tests:
    name: Swift Testing (Linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Swift toolchain
        uses: swift-actions/setup-swift@v2
        with:
          # setup-swift@v2 keeps a hardcoded version list that tops out at
          # 6.2.1 — newer releases (6.3/6.4) are unknown to it and fail at
          # install time. 6.2.1 ships the Testing module, which the suite needs.
          swift-version: "6.2.1"

      # Basic checks only: the kit is Foundation-only, so the DTO suite builds
      # and runs on Linux. App target, check scripts (pmset) and the release
      # bundle stay macOS-only (release.yml, macos-26).
      - name: Run Swift Testing suite
        run: |
          swift --version
          swift test
